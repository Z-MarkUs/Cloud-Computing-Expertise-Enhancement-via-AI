name: cloud-tutor

services:
  app:
    image: cloud-tutor:local
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - "${CLOUD_TUTOR_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CLOUD_TUTOR_ENVIRONMENT: "${CLOUD_TUTOR_ENVIRONMENT:-production}"
      CLOUD_TUTOR_MODE: "${CLOUD_TUTOR_MODE:-demo}"
      CLOUD_TUTOR_LOG_LEVEL: "${CLOUD_TUTOR_LOG_LEVEL:-INFO}"
      CLOUD_TUTOR_CORS_ORIGINS: "${CLOUD_TUTOR_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.0
