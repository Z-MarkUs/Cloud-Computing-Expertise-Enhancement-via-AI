[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stratusguide"
version = "2.0.0"
description = "A production-shaped, source-grounded cloud computing tutor with offline and Azure providers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hehan Zhao" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.19,<2.0",
  "azure-search-documents>=11.6,<12.0",
  "openai>=1.55,<2.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
cloud-tutor = "cloud_tutor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_tutor"]

[tool.hatch.build.targets.wheel.force-include]
"data/cloud_knowledge.json" = "cloud_tutor/data/cloud_knowledge.json"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/data",
  "/tests",
  "/evals",
  "/LICENSE",
  "/SECURITY.md",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["cloud_tutor"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".idea"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cloud_tutor"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["azure.*", "openai.*"]
ignore_missing_imports = true
